name: autograde

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  autograde:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Jest
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --save-dev jest@29

      - name: Write jest config
        run: |
          cat > jest.config.cjs <<'EOF'
          module.exports = {
            testEnvironment: 'node',
            testMatch: ['**/__tests__/**/*.test.cjs']
          };
          EOF

      - name: Write tests
        run: |
          mkdir -p __tests__
          cat > __tests__/iteration.test.cjs <<'TESTEOF'
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');

          const scriptPath = path.resolve(process.cwd(), 'script.js');
          const source = fs.existsSync(scriptPath) ? fs.readFileSync(scriptPath, 'utf8') : '';

          function runWithPrompts(inputs) {
            const alerts = [];
            let callIndex = 0;
            const sandbox = {
              prompt: () => {
                if (callIndex < inputs.length) {
                  return inputs[callIndex++];
                }
                return null;
              },
              alert: (msg) => alerts.push(String(msg)),
              console: { log: () => {}, error: () => {}, warn: () => {} },
              parseInt,
              parseFloat,
              isNaN,
              NaN,
              undefined,
              String,
              Number,
              Math,
            };
            vm.createContext(sandbox);
            vm.runInContext(source, sandbox, { timeout: 5000 });
            return alerts;
          }

          describe('Unit 8.4 – Iteration', () => {

            test('handles invalid input then accepts valid input', () => {
              // Give invalid inputs first, then a valid one — the while loop should keep prompting
              const alerts = runWithPrompts(['abc', '-1', '0', '3']);
              // Should have alerted "Invalid input" for each bad input
              expect(alerts[0]).toBe('Invalid input');
              expect(alerts[1]).toBe('Invalid input');
              expect(alerts[2]).toBe('Invalid input');
              // Then should show the list and sum for 3
              expect(alerts).toContain('1, 2, 3');
              expect(alerts).toContain('Sum: 6');
            });

            test('script.js uses a while loop', () => {
              expect(source).toMatch(/\bwhile\s*\(/);
            });

            test('script.js uses a for loop', () => {
              expect(source).toMatch(/\bfor\s*\(/);
            });

            test('lists numbers 1 to N for N=5', () => {
              const alerts = runWithPrompts(['5']);
              expect(alerts.length).toBeGreaterThanOrEqual(2);
              expect(alerts[0]).toBe('1, 2, 3, 4, 5');
            });

            test('calculates correct sum for N=5', () => {
              const alerts = runWithPrompts(['5']);
              expect(alerts.length).toBeGreaterThanOrEqual(2);
              expect(alerts[1]).toBe('Sum: 15');
            });

            test('works correctly for N=3', () => {
              const alerts = runWithPrompts(['3']);
              expect(alerts.length).toBeGreaterThanOrEqual(2);
              expect(alerts[0]).toBe('1, 2, 3');
              expect(alerts[1]).toBe('Sum: 6');
            });

          });
          TESTEOF

      # === Graded steps (sum to 100) ===
      - id: t_invalid
        name: handles invalid input
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: handles invalid input
          setup-command: echo "ready"
          command: npx jest --runInBand --testNamePattern "handles invalid input then accepts valid input$"
          timeout: 60
          max-score: 20

      - id: t_while_loop
        name: script.js uses a while loop
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: script.js uses a while loop
          setup-command: echo "ready"
          command: npx jest --runInBand --testNamePattern "script.js uses a while loop$"
          timeout: 60
          max-score: 10

      - id: t_for_loop
        name: script.js uses a for loop
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: script.js uses a for loop
          setup-command: echo "ready"
          command: npx jest --runInBand --testNamePattern "script.js uses a for loop$"
          timeout: 60
          max-score: 10

      - id: t_list
        name: lists numbers 1 to N
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: lists numbers 1 to N
          setup-command: echo "ready"
          command: npx jest --runInBand --testNamePattern "lists numbers 1 to N for N=5$"
          timeout: 60
          max-score: 20

      - id: t_sum
        name: calculates correct sum
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: calculates correct sum
          setup-command: echo "ready"
          command: npx jest --runInBand --testNamePattern "calculates correct sum for N=5$"
          timeout: 60
          max-score: 20

      - id: t_n3
        name: works correctly for N=3
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: works correctly for N=3
          setup-command: echo "ready"
          command: npx jest --runInBand --testNamePattern "works correctly for N=3$"
          timeout: 60
          max-score: 20

      # Build & publish combined summary
      - name: Build & publish combined summary
        shell: bash
        run: |
          npx jest --runInBand --json --outputFile=jest-summary.json || true
          node - <<'NODE'
          const fs = require("fs");
          let jr = {};
          try { jr = JSON.parse(fs.readFileSync("jest-summary.json","utf8")); } catch {}
          const assertions = (jr.testResults||[]).flatMap(t => t.assertionResults || []);

          const wanted = [
            "handles invalid input then accepts valid input",
            "script.js uses a while loop",
            "script.js uses a for loop",
            "lists numbers 1 to N for N=5",
            "calculates correct sum for N=5",
            "works correctly for N=3"
          ];

          const weights = {
            "handles invalid input then accepts valid input": 20,
            "script.js uses a while loop": 10,
            "script.js uses a for loop": 10,
            "lists numbers 1 to N for N=5": 20,
            "calculates correct sum for N=5": 20,
            "works correctly for N=3": 20
          };

          const status = {};
          for (const name of wanted) {
            const a = assertions.find(x => x.title === name);
            status[name] = !!a && a.status === "passed";
          }

          const earned = Object.entries(weights).reduce((sum, [k, pts]) => sum + (status[k] ? pts : 0), 0);
          const total = Object.values(weights).reduce((a,b)=>a+b,0);

          const lines = [];
          lines.push("# Unit 8.4 Autograder Summary");
          lines.push(`**Score: ${earned}/${total}**`, "");
          for (const name of wanted) {
            const weight = weights[name] || 0;
            lines.push(`${status[name] ? "✅" : "❌"} ${name} (${weight} pts)`);
          }
          console.log(lines.join("\n"));

          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          if (summaryPath) fs.appendFileSync(summaryPath, lines.join("\n") + "\n");
          NODE

      # Prepare reporter env
      - name: Prepare reporter env
        id: prepEnv
        shell: bash
        run: |
          echo "T_INVALID_RESULTS=${{ steps.t_invalid.outputs.result }}"         >> "$GITHUB_ENV"
          echo "T_WHILE_LOOP_RESULTS=${{ steps.t_while_loop.outputs.result }}"   >> "$GITHUB_ENV"
          echo "T_FOR_LOOP_RESULTS=${{ steps.t_for_loop.outputs.result }}"       >> "$GITHUB_ENV"
          echo "T_LIST_RESULTS=${{ steps.t_list.outputs.result }}"               >> "$GITHUB_ENV"
          echo "T_SUM_RESULTS=${{ steps.t_sum.outputs.result }}"                 >> "$GITHUB_ENV"
          echo "T_N3_RESULTS=${{ steps.t_n3.outputs.result }}"                   >> "$GITHUB_ENV"

      # Report to Classroom
      - name: Report grades
        uses: classroom-resources/autograding-grading-reporter@v1
        with:
          runners: 't_invalid,t_while_loop,t_for_loop,t_list,t_sum,t_n3'
          token: ${{ github.token }}
